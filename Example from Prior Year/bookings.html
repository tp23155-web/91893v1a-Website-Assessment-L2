<h1>Sam Sawyer - Bookings</h1>
            
<h2>Like what you see? Willing to take it to the next level? Then fill out this form:</h2>
<form action="#" method="post">
  <label for="first-name"></label>
  <input type="text" id="first-name" name="first-name" value="Enter first name" required><br><br>

  <label for="last-name"></label>
  <input type="text" id="last-name" name="last-name" value="Enter last name" required><br><br>

  <label for="email"></label>
  <input type="email" id="email" name="email" value="Enter email" required><br><br>

  <label for="city"></label>
  <input type="text" id="city" name="city" value="Enter city" required><br><br>

  <label for="Region"></label>
  <input type="text" id="Region" name="Region" value="Enter region" required><br><br>

  <label for="postal-code"></label>
  <input type="text" id="postal-code" name="postal-code" value="Enter postal code" required><br><br>

  <label for="phone-number"></label>
  <input type="text" id="phone-number" name="phone-number" value="Enter phone number" required><br><br>

  <label for="comments"></label>
  <input type="text" id="comments" name="comments" value="Enter comments"><br><br>

  <input type="submit" value="Submit">
</form>

<script>

  const inputs = document.querySelectorAll("input[type='text'], input[type='email']");


  inputs.forEach(input => {
      const defaultValue = input.value;


      input.addEventListener("focus", function() {
          if (this.value === defaultValue) {
              this.value = "";
          }
      });

      input.addEventListener("blur", function() {
          if (this.value === "") {
              this.value = defaultValue;
          }
      });
  });
</script>
